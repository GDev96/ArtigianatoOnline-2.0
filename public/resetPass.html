<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reimposta Password - Artigianato Online</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
    <div id="navbar"></div>

    <div class="container mt-5 pt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow p-4">
                    <h2 class="text-center mb-4">Reimposta Password</h2>
                    <div id="tokenError" class="alert alert-danger d-none">
                        Il link di recupero non è valido o è scaduto.
                    </div>
                    <form id="resetPasswordForm" class="needs-validation">
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">Nuova Password</label>
                            <div class="password-container">
                                <input type="password" class="form-control" id="newPassword" 
                                       placeholder="Inserisci la nuova password" required>
                                <i class="bi bi-eye-slash password-toggle" id="toggleNewPassword"></i>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Conferma Password</label>
                            <div class="password-container">
                                <input type="password" class="form-control" id="confirmPassword" 
                                       placeholder="Conferma la nuova password" required>
                                <i class="bi bi-eye-slash password-toggle" id="toggleConfirmPassword"></i>
                            </div>
                        </div>
                        <div id="resetError" class="alert alert-danger d-none">
                            <!-- Error message will be inserted here -->
                        </div>
                        <div id="resetSuccess" class="alert alert-success d-none">
                            Password aggiornata con successo! Verrai reindirizzato alla pagina di login...
                        </div>
                        <button type="submit" class="btn w-100 mt-3">Reimposta Password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div id="footer"></div>

    <script src="/js/services/AuthService.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/reset-password.js"></script>
</body>
</html>
