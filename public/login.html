<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Artigianato Online</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
    <div id="navbar"></div>

    <div class="container mt-5 pt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow p-4">
                    <h2 class="text-center mb-4">Accedi</h2>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="usernameInput" class="form-label">Username</label>
                            <input type="text" class="form-control" id="usernameInput" 
                                   placeholder="Inserisci il tuo username" required>
                        </div>
                        <div class="mb-3">
                            <label for="passwordInput" class="form-label">Password</label>
                            <div class="password-container">
                                <input type="password" class="form-control" id="passwordInput" 
                                    placeholder="Inserisci la tua password" required>
                                <i class="bi bi-eye-slash password-toggle" id="togglePassword"></i>
                            </div>
                        </div>

                        <div id="loginError" class="alert alert-danger d-none" role="alert">
                            <!-- Messaggio di errore sarà inserito qui -->
                        </div>

                        <button type="submit" class="btn w-100 mt-3">Accedi</button>
                    </form>
                    <div class="text-center mt-0">
                        <a href="#" class="recover-link me-2" data-bs-toggle="modal" data-bs-target="#recoverPasswordModal">
                            Password dimenticata?
                        </a>
                        <span class="text-muted">|</span>
                        <a href="/signup.html" class="register-link ms-2">Non hai un account? Registrati!</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Password Recovery Modal -->
    <div class="modal fade" id="recoverPasswordModal" tabindex="-1" aria-labelledby="recoverPasswordModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="recoverPasswordModalLabel">Recupera Password</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="recoverPasswordForm">
                        <div class="mb-3">
                            <label for="emailInput" class="form-label">Email</label>
                            <input type="email" class="form-control" id="emailInput" 
                                placeholder="Inserisci la tua email" required>
                        </div>
                        <div id="recoverError" class="alert alert-danger d-none" role="alert">
                            <!-- Error message will be inserted here -->
                        </div>
                        <div id="recoverSuccess" class="alert alert-success d-none" role="alert">
                            <!-- Success message will be inserted here -->
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Chiudi</button>
                    <button type="button" class="btn btn-primary" onclick="requestPasswordRecovery()">
                        Invia Link di Recupero
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="footer"></div>

    <script src="/js/services/AuthService.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/login.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // Redirect if already authenticated
        if (AuthService.checkAuth()) {
            window.location.href = '/index.html';
        }
    });
    </script>
</body>
</html>
